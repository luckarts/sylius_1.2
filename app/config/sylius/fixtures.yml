# Fixtures FleuristeParis

sylius_fixtures:
    suites:
        # Suite de base avec channel, locales, etc.
        fleuriste_base:
            listeners:
                logger: ~

            fixtures:
                locale:
                    options:
                        locales:
                            - 'fr_FR'

                currency:
                    options:
                        currencies:
                            - 'EUR'

                geographical:
                    options:
                        countries:
                            - 'FR'
                            - 'US'
                        zones:
                            EU:
                                name: "Europe"
                                countries:
                                    - 'FR'
                            US:
                                name: "United States of America"
                                countries:
                                    - 'US'

                channel:
                    options:
                        custom:
                            fleuriste_paris:
                                name: "Fleuriste Paris"
                                code: "FLEURISTE_PARIS"
                                locales:
                                    - 'fr_FR'
                                currencies:
                                    - 'EUR'
                                default_locale: 'fr_FR'
                                base_currency: 'EUR'
                                enabled: true
                                hostname: "localhost"
                                contact_email: "contact@fleuriste-paris.fr"
                                theme_name: ~

                payment_method:
                    options:
                        custom:
                            cash_on_delivery:
                                code: "cash_on_delivery"
                                name: "Paiement à la livraison"
                                enabled: true
                                channels:
                                    - "FLEURISTE_PARIS"
                            credit_card:
                                code: "credit_card"
                                name: "Carte bancaire"
                                enabled: true
                                channels:
                                    - "FLEURISTE_PARIS"

                shipping_method:
                    options:
                        custom:
                            express_delivery:
                                code: "express_delivery"
                                name: "Livraison Express (24h)"
                                enabled: true
                                channels:
                                    - "FLEURISTE_PARIS"
                            standard_delivery:
                                code: "standard_delivery"
                                name: "Livraison Standard (48-72h)"
                                channels:
                                    - "FLEURISTE_PARIS"
                            store_pickup:
                                code: "store_pickup"
                                name: "Retrait en boutique"
                                channels:
                                    - "FLEURISTE_PARIS"

                admin_user:
                    options:
                        custom:
                            -
                                email: "admin@fleuriste-paris.fr"
                                username: "admin"
                                password: "admin123"
                                enabled: true
                                locale_code: "fr_FR"
                                first_name: "Admin"
                                last_name: "Fleuriste"

                tax_category:
                    options:
                        custom:
                            flowers:
                                code: "flowers"
                                name: "Fleurs et plantes"
                            accessories:
                                code: "accessories"
                                name: "Accessoires"

                tax_rate:
                    options:
                        custom:
                            vat_flowers:
                                code: "vat_flowers_10"
                                name: "TVA Fleurs 10%"
                                zone: "EU"
                                category: "flowers"
                                amount: 0.10
                            vat_accessories:
                                code: "vat_accessories_20"
                                name: "TVA Accessoires 20%"
                                zone: "EU"
                                category: "accessories"
                                amount: 0.20

        # Suite taxons uniquement
        fleuriste_taxons:
            listeners:
                logger: ~

            fixtures:
                taxon:
                    options:
                        custom:
                            categories:
                                name: "Catégories"
                                code: "categories"
                                slug: "categories"
                                description: "Toutes nos catégories de bouquets"
                                children:
                                    roses:
                                        name: "Roses"
                                        code: "roses"
                                        slug: "roses"
                                        description: "Bouquets de roses"
                                    mixed:
                                        name: "Mixte"
                                        code: "mixed"
                                        slug: "mixed"
                                        description: "Compositions mixtes"
                                    funeral:
                                        name: "Funéraire"
                                        code: "funeral"
                                        slug: "funeral"
                                        description: "Compositions funéraires"
                                    birth:
                                        name: "Naissance"
                                        code: "birth"
                                        slug: "birth"
                                        description: "Bouquets de naissance"
                                    plants:
                                        name: "Plantes"
                                        code: "plants"
                                        slug: "plants"
                                        description: "Plantes et orchidées"

                            occasions:
                                name: "Occasions"
                                code: "occasions"
                                slug: "occasions"
                                description: "Bouquets par occasion"
                                children:
                                    valentines_day:
                                        name: "Saint-Valentin"
                                        code: "valentines-day"
                                        slug: "valentines-day"
                                        description: "Bouquets romantiques"
                                    birthday:
                                        name: "Anniversaire"
                                        code: "birthday"
                                        slug: "birthday"
                                        description: "Bouquets anniversaire"
                                    mourning:
                                        name: "Deuil"
                                        code: "mourning"
                                        slug: "mourning"
                                        description: "Compositions de deuil"
                                    birth_occasion:
                                        name: "Naissance"
                                        code: "birth-occasion"
                                        slug: "birth-occasion"
                                        description: "Célébrer une naissance"
                                    thank_you:
                                        name: "Remerciement"
                                        code: "thank-you"
                                        slug: "thank-you"
                                        description: "Dire merci"
                                    marriage_proposal:
                                        name: "Demande en Mariage"
                                        code: "marriage-proposal"
                                        slug: "marriage-proposal"
                                        description: "Demande en mariage"

